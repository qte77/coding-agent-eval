name: pytest
permissions:
  contents: read
on:
  push:
  pull_request:
    types: [closed]
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      # Use Python version from pyproject.toml to prevent version divergence
      # Workflow cache prevents long load times after initial setup
      - run: uv python install
      - run: uv sync --group dev
      - run: make test_all
