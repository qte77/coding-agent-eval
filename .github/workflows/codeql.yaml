---
# https://github.blog/changelog/2023-01-18-code-scanning-codeql-action-v1-is-now-deprecated/
name: "CodeQL"

on:
  push:
  pull_request:
    types: [closed]
    branches: [ main ]
  schedule:
    - cron: '27 11 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

    - name: Initialize CodeQL
      uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
      with:
        languages: python

    - name: Autobuild
      uses: github/codeql-action/autobuild@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
    # if autobuild fails
    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3.36.2
    #- name: sarif
    #  uses: github/codeql-action/upload-sarif@v2
...
